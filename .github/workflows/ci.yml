name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and tooling
        run: python -m pip install --no-build-isolation -e .[test,docs] build twine

      - name: Run tests
        run: pytest -q

      - name: Build docs
        run: sphinx-build -n -W -b html docs docs/_build/html

      - name: Build distribution
        run: python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - name: Wheel install smoke test
        run: |
          python -m venv .pkg-venv
          .pkg-venv/bin/pip install --upgrade pip
          .pkg-venv/bin/pip install dist/*.whl
          .pkg-venv/bin/python -c "import llm_batch_annotate; print(llm_batch_annotate.__version__)"

      - name: Upload built distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
